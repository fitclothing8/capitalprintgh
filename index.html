    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                registrations.forEach(reg => {
                    if (reg.active && reg.active.scriptURL.includes('serviceworker.js')) {
                        // Keep the current one
                        console.log('Active service worker retained:', reg.active.scriptURL);
                    } else {
                        // Unregister any others
                        reg.unregister().then(() => {
                            console.log('Old service worker unregistered:', reg.scope);
                        });
                    }
                });
            });
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/serviceworker.js')
                    .then((registration) => {
                        console.log(`Service Worker registered with scope: ${registration.scope}`);

                        // Check for service worker updates
                        registration.onupdatefound = () => {
                            const newWorker = registration.installing;
                            console.log('New Service Worker found, updating...');
                            newWorker.onstatechange = () => {
                                if (newWorker.state === 'activated') {
                                    console.log('New Service Worker activated. Consider refreshing!');
                                }
                            };
                        };
                    })
                    .catch((error) => {
                        console.error('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
    <script>
        document.getElementById("scrollToggleBtn").addEventListener("click", function () {
            const footer = document.querySelector("footer");
            const topBanner = document.querySelector(".top-banner");
            const icon = this.querySelector("i"); // Reference to the icon
            const isAtBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight;

            if (!isAtBottom) {
                footer.scrollIntoView({ behavior: "smooth" });
                icon.classList.remove("fa-arrow-down");
                icon.classList.add("fa-arrow-up"); // Change icon when scrolling down
            } else {
                topBanner.scrollIntoView({ behavior: "smooth" });
                icon.classList.remove("fa-arrow-up");
                icon.classList.add("fa-arrow-down"); // Change icon when scrolling up
            }
        });
    </script>

    <script>
        // Welcome popup timer (10 seconds)
        window.setWelcomePopupTimer = function (dotNetHelper) {
            setTimeout(function () {
                if (dotNetHelper) {
                    dotNetHelper.invokeMethodAsync('ShowWelcomePopup');
                }
            }, 10000); // 10 seconds
        };

        // Add new order brand row to the table
        window.addOrderBrandRow = function () {
            try {
                var table = document.getElementById('orderBrandTable');
                if (!table) {
                    console.warn('addOrderBrandRow: #orderBrandTable not found');
                    return;
                }

                var tbody = table.querySelector('tbody');
                if (!tbody) return;

                // Create new row with same structure as existing row
                var newRow = document.createElement('tr');
                newRow.className = 'order-brand-row';
                newRow.innerHTML = `
            <td>
              <select class="form-control brandSelect">
                <option value="">Select Brand</option>
                <option value="Vicayo">Vicayo</option>
                <option value="Zara">Zara</option>
                <option value="Nisa">Nisa</option>
                <option value="Supreme">Supreme</option>
                <option value="Pilot">Pilot</option>
                <option value="Aoakyami">Aoakyami</option>
                <option value="MPO">MPO</option>
              </select>
            </td>
            <td>
              <select class="form-control typeSelect">
                <option value="">Select Type</option>
                <option value="Cotton">Cotton</option>
                <option value="Jersey">Jersey</option>
              </select>
            </td>
            <td>
              <select class="form-control sizeSelectBrand">
                <option value="">Select Size</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="XXL">2XL</option>
                <option value="XXXL">3XL</option>
              </select>
            </td>
            <td>
              <select class="form-control quantityInput">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </td>
            <td>
              <button class="btn btn-danger btn-sm" type="button" onclick="removeOrderBrandRow(this)">Remove</button>
            </td>
          `;

                tbody.appendChild(newRow);
                console.log('Order brand row added');
            } catch (err) {
                console.error('addOrderBrandRow error:', err);
            }
        };

        // Remove order brand row
        window.removeOrderBrandRow = function (button) {
            try {
                var row = button.closest('tr');
                if (row) {
                    row.remove();
                    console.log('Order brand row removed');
                }
            } catch (err) {
                console.error('removeOrderBrandRow error:', err);
            }
        };

        // Initialize page components
        window.initializePageComponents = function (elementId, text) {
            try {
                var el = document.getElementById(elementId);
                if (el) {
                    el.textContent = text || el.textContent;
                }
            } catch (err) {
                console.warn('initializePageComponents error:', err);
            }
        };

        // Generate thumbnails
        window.generateThumbnails = function (thumbSrc) {
            try {
                var container = document.querySelector('.thumbnail-container');
                if (!container) {
                    console.warn('generateThumbnails: .thumbnail-container not found');
                    return;
                }
            } catch (err) {
                console.warn('generateThumbnails error:', err);
            }
        };

        // Re-initialize panzoom
        window.reInitPanzoom = function () {
            try {
                var img = document.getElementById('mainModalImage');
                if (!img || !window.Panzoom) return;

                if (img.panzoomInstance) {
                    img.panzoomInstance.destroy();
                    img.panzoomInstance = null;
                }
                img.panzoomInstance = window.Panzoom(img, {
                    maxScale: 4,
                    minScale: 1,
                    contain: 'outside',
                    startScale: 1,
                    step: 0.3,
                    panOnlyWhenZoomed: true
                });
                if (img.parentElement) {
                    img.parentElement.addEventListener('wheel', img.panzoomInstance.zoomWithWheel);
                }
            } catch (err) {
                console.warn('reInitPanzoom error:', err);
            }
        };

        // Capture modal and send order
        window.captureModalAndSend = function () {
            try {
                const orderTable = document.getElementById('orderBrandTable');

                if (!orderTable) {
                    alert('Order table not found. Please refresh and try again.');
                    return;
                }

                const orders = [];
                const rows = orderTable.querySelectorAll('.order-brand-row');

                rows.forEach(function (row) {
                    const brand = row.querySelector('.brandSelect')?.value || '';
                    const type = row.querySelector('.typeSelect')?.value || '';
                    const size = row.querySelector('.sizeSelectBrand')?.value || '';
                    const quantity = row.querySelector('.quantityInput')?.value || '';

                    // Ignore completely empty rows
                    if (!brand && !type && !size) {
                        return;
                    }

                    orders.push({
                        brand: brand,
                        type: type,
                        size: size,
                        quantity: quantity
                    });
                });

                if (orders.length === 0) {
                    alert('Please select at least one brand order.');
                    return;
                }

                // Validate each order before WhatsApp opens
                for (let i = 0; i < orders.length; i++) {
                    if (!orders[i].brand) {
                        alert('Please select a brand for order ' + (i + 1) + '.');
                        return;
                    }

                    if (!orders[i].type) {
                        alert('Please select a type for order ' + (i + 1) + '.');
                        return;
                    }

                    if (!orders[i].size) {
                        alert('Please select a size for order ' + (i + 1) + '.');
                        return;
                    }

                    if (!orders[i].quantity) {
                        alert('Please select a quantity for order ' + (i + 1) + '.');
                        return;
                    }
                }

                let message = 'Hello Capital Print GH,\n\n';
                message += 'I would like to place an order:\n\n';

                orders.forEach(function (order, index) {
                    message += 'Order ' + (index + 1) + '\n';
                    message += 'Brand: ' + order.brand + '\n';
                    message += 'Type: ' + order.type + '\n';
                    message += 'Size: ' + order.size + '\n';
                    message += 'Quantity: ' + order.quantity + '\n\n';
                });

                message += 'Please confirm availability and pricing. Thank you.';

                /*
                * WhatsApp wa.me numbers should be written
                * without the leading + sign.
                */
                const whatsappNumber = '2330598185513';

                const whatsappUrl =
                    'https://wa.me/' +
                    whatsappNumber +
                    '?text=' +
                    encodeURIComponent(message);

                // Open WhatsApp / WhatsApp Web
                window.open(whatsappUrl, '_blank');

                // Close the order popup
                closeOrderPopup();

            } catch (err) {
                console.error('captureModalAndSend error:', err);
                alert('An error occurred while processing your order.');
            }
        };

        // Close order modal
        window.closeOrderModal = function () {
            try {
                var modal = document.getElementById('orderPopup');
                if (modal) {
                    modal.style.display = 'none';
                }
            } catch (err) {
                console.warn('closeOrderModal error:', err);
            }
        };

        // Open order popup
        window.openOrderPopup = function () {
            try {
                var modal = document.getElementById('orderPopup');
                if (modal) {
                    modal.style.display = 'block';
                }
            } catch (err) {
                console.warn('openOrderPopup error:', err);
            }
        };
    </script>
